<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f0f4f8">
<title>AI Researcher Talent Map</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f0f4f8;--card:#fff;--border:#e2e8f0;--accent:#2563eb;--accent2:#0891b2;--text:#1e293b;--muted:#64748b}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

.bg-orbs{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:0.35;animation:drift 20s ease-in-out infinite}
.orb:nth-child(1){width:300px;height:300px;background:rgba(37,99,235,0.12);top:-80px;left:10%;animation-duration:22s}
.orb:nth-child(2){width:250px;height:250px;background:rgba(8,145,178,0.1);top:40%;right:5%;animation-duration:18s;animation-delay:-5s}
.orb:nth-child(3){width:200px;height:200px;background:rgba(139,92,246,0.08);bottom:10%;left:30%;animation-duration:25s;animation-delay:-10s}
@keyframes drift{0%,100%{transform:translate(0,0)}33%{transform:translate(20px,-30px)}66%{transform:translate(-15px,20px)}}

canvas#pts{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}

.wrap{max-width:1400px;margin:0 auto;padding:1.5rem;position:relative;z-index:1}

.hd{text-align:center;padding:2rem 0 1rem;animation:slideD .7s ease-out}
@keyframes slideD{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.hd h1{font-size:clamp(1.5rem,4vw,2.4rem);font-weight:800;background:linear-gradient(135deg,#1d4ed8,#0891b2,#7c3aed);background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gShift 4s ease-in-out infinite}
@keyframes gShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hd p{color:var(--muted);font-size:.9rem;margin-top:.4rem}
.dot{display:inline-block;width:7px;height:7px;background:#10b981;border-radius:50%;margin-right:5px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.4)}50%{box-shadow:0 0 0 6px rgba(16,185,129,0)}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.75rem;margin:1rem 0}
.sc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.03);opacity:0;transform:translateY(15px);animation:pop .5s ease-out forwards;transition:transform .3s,box-shadow .3s}
.sc:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(37,99,235,.08)}
.sc:nth-child(1){animation-delay:.1s}.sc:nth-child(2){animation-delay:.15s}.sc:nth-child(3){animation-delay:.2s}.sc:nth-child(4){animation-delay:.25s}.sc:nth-child(5){animation-delay:.3s}.sc:nth-child(6){animation-delay:.35s}
@keyframes pop{to{opacity:1;transform:translateY(0)}}
.sc .n{font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,#1d4ed8,#0891b2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sc .l{color:var(--muted);font-size:.72rem;margin-top:.2rem}

.bar{display:flex;flex-wrap:wrap;gap:.4rem;margin:.8rem 0;align-items:center;animation:fUp .5s ease-out .3s both}
@keyframes fUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.sb{padding:.35rem .8rem;border:1px solid var(--border);border-radius:18px;background:var(--card);color:var(--muted);font-size:.8rem;cursor:pointer;transition:all .25s;white-space:nowrap}
.sb:hover{border-color:var(--accent);color:var(--text)}
.sb.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(37,99,235,.25)}
.sx{flex:1;min-width:160px;padding:.5rem .8rem;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:.85rem;outline:none}
.sx:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.badge{display:inline-block;padding:0 5px;border-radius:8px;background:rgba(37,99,235,.08);color:var(--accent);font-size:.65rem;font-weight:600;margin-left:3px}

.sbar{display:flex;gap:.4rem;margin-bottom:.8rem;align-items:center;flex-wrap:wrap;animation:fUp .5s ease-out .4s both}
.sbar span{color:var(--muted);font-size:.8rem}
.st{padding:.3rem .7rem;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--muted);font-size:.75rem;cursor:pointer;transition:all .2s}
.st:hover{border-color:var(--accent2);color:var(--text)}
.st.on{background:rgba(8,145,178,.1);border-color:var(--accent2);color:#0e7490;font-weight:600}

.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--border);background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.03);animation:fUp .5s ease-out .5s both;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{position:sticky;top:0;background:#f8fafc;color:var(--accent2);font-weight:700;text-align:left;padding:.7rem .6rem;border-bottom:2px solid var(--border);font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td{padding:.6rem;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr{transition:background .15s}
tr:hover{background:#eff6ff}
tr:nth-child(even){background:#fafcfd}
.re{animation:rSlide .3s ease-out both}
@keyframes rSlide{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}

.tg{display:inline-block;padding:.12rem .4rem;border-radius:4px;font-size:.65rem;font-weight:500;margin:1px;border:1px solid;transition:transform .2s}
.tg:hover{transform:scale(1.08)}
.t-LLM{background:rgba(139,92,246,.08);border-color:rgba(139,92,246,.2);color:#7c3aed}
.t-ML{background:rgba(8,145,178,.08);border-color:rgba(8,145,178,.2);color:#0e7490}
.t-DL{background:rgba(37,99,235,.08);border-color:rgba(37,99,235,.2);color:#1d4ed8}
.t-MM{background:rgba(219,39,119,.08);border-color:rgba(219,39,119,.2);color:#be185d}
.t-CV{background:rgba(5,150,105,.08);border-color:rgba(5,150,105,.2);color:#047857}
.t-NLP{background:rgba(217,119,6,.08);border-color:rgba(217,119,6,.2);color:#b45309}
.t-Infra{background:rgba(220,38,38,.08);border-color:rgba(220,38,38,.2);color:#dc2626}
.t-Rec{background:rgba(161,98,7,.08);border-color:rgba(161,98,7,.2);color:#92400e}
.t-Other{background:rgba(100,116,139,.08);border-color:rgba(100,116,139,.2);color:#475569}

.lk{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;border:1px solid var(--border);color:var(--muted);text-decoration:none;font-size:.65rem;font-weight:600;transition:all .25s;margin-right:3px}
.lk:hover{border-color:var(--accent);color:var(--accent);transform:scale(1.15)}
.star{color:#d97706;font-size:.7rem;font-weight:700}

.pg{display:flex;justify-content:center;align-items:center;gap:.5rem;margin:1.2rem 0}
.pb{padding:.4rem .8rem;border:1px solid var(--border);border-radius:7px;background:var(--card);color:var(--text);cursor:pointer;font-size:.8rem;transition:all .2s}
.pb:hover{border-color:var(--accent)}
.pb:disabled{opacity:.3;cursor:not-allowed}
.pi{color:var(--muted);font-size:.8rem}

.ft{text-align:center;padding:1.5rem 0;color:var(--muted);font-size:.75rem}

@media(max-width:768px){
  .wrap{padding:.8rem}
  .stats{grid-template-columns:repeat(3,1fr);gap:.5rem}
  .sc{padding:.7rem}
  .sc .n{font-size:1.2rem}
  table{font-size:.72rem}
  th,td{padding:.5rem .4rem}
  .tg{font-size:.6rem;padding:.1rem .3rem}
}
@media(max-width:480px){
  .stats{grid-template-columns:repeat(2,1fr)}
}

/* === Analytics Dashboard === */
.ana-toggle{text-align:center;margin:.8rem 0}
.ana-btn{padding:.5rem 1.5rem;border:1px solid var(--accent);border-radius:20px;background:transparent;color:var(--accent);font-size:.85rem;cursor:pointer;transition:all .3s;font-weight:600}
.ana-btn:hover,.ana-btn.on{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.2)}
.ana{display:none;margin:1rem 0;animation:fUp .5s ease-out}
.ana.show{display:block}
.ana-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
@media(max-width:768px){.ana-grid{grid-template-columns:1fr}}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.2rem;box-shadow:0 2px 8px rgba(0,0,0,.03);transition:transform .3s,box-shadow .3s}
.chart-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(37,99,235,.06)}
.chart-title{font-size:.85rem;font-weight:700;color:var(--text);margin-bottom:.8rem;display:flex;align-items:center;gap:.4rem}
.chart-title .ic{font-size:1rem}
.hbar{margin-bottom:.45rem;display:flex;align-items:center;gap:.5rem}
.hbar-label{flex:0 0 140px;text-align:right;font-size:.72rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-track{flex:1;height:20px;background:#f1f5f9;border-radius:10px;overflow:hidden;position:relative}
.hbar-fill{height:100%;border-radius:10px;transition:width 1s cubic-bezier(.25,.8,.25,1);position:relative}
.hbar-fill::after{content:attr(data-v);position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:.65rem;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.hbar-val{flex:0 0 35px;font-size:.72rem;font-weight:600;color:var(--text)}

/* region donut */
.donut-wrap{display:flex;align-items:center;gap:1.5rem;justify-content:center;flex-wrap:wrap}
.donut-svg{width:160px;height:160px;transform:rotate(-90deg)}
.donut-svg circle{fill:none;stroke-width:28;transition:stroke-dasharray 1s ease}
.donut-legend{display:flex;flex-direction:column;gap:.4rem}
.legend-item{display:flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--text)}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

/* h-index tiers */
.tier-grid{display:flex;gap:.5rem;align-items:flex-end;justify-content:center;height:120px;padding-top:.5rem}
.tier-col{display:flex;flex-direction:column;align-items:center;gap:.3rem;flex:1}
.tier-bar{width:100%;border-radius:6px 6px 0 0;transition:height 1s cubic-bezier(.25,.8,.25,1);min-width:30px}
.tier-num{font-size:.75rem;font-weight:700;color:var(--text)}
.tier-label{font-size:.62rem;color:var(--muted);text-align:center;white-space:nowrap}
</style>
</head>

on and Pattern Recognition","International Conference on Machine Learning"]},{"n":"Shuai Yi","af":"","sc":"Sichuan University","cs":"PhD*","h":3,"c":69,"p":3,"d":["Other"],"v":["Neural Information Processing Systems","International Conference on Machine Learning"]},{"n":"Wenxuan Tu","af":"","sc":"Hainan University","cs":"PhD*","h":2,"c":14,"p":5,"d":["ML","LLM","CV"],"v":["ACM Multimedia","AAAI Conference on Artificial Intelligence"]},{"n":"Chuxu Zhang","af":"","cs":"PhD*","h":2,"c":11,"p":4,"d":["Other"],"v":["Knowledge Discovery and Data Mining","The Web Conference"]},{"n":"Jian-Dong Liu","af":"","sc":"Taiyuan University of Technology","cs":"PhD*","h":2,"c":19,"p":4,"d":["Other"],"v":["International Joint Conference on Artificial Intelligence","Knowledge Discovery and Data Mining","AAAI Conference on Artificial Intelligence"]},{"n":"Huy Dao","af":"","cs":"PhD*","h":2,"c":31,"p":4,"d":["LLM"],"v":["Annual International ACM SIGIR Conference on Research and Development in Information Retrieval","Conference on Empirical Methods in Natural Language Processing"]},{"n":"J. Y. Chen","af":"","sc":"Washington University in St. Louis","cs":"PhD*","h":2,"c":27,"p":3,"d":["Other"],"v":["International Conference on Learning Representations","Neural Information Processing Systems","International Conference on Machine Learning"]},{"n":"Shuang Li","af":"","cs":"PhD*","h":2,"c":8,"p":3,"d":["MM","DL"],"v":["Neural Information Processing Systems","International Conference on Machine Learning"]},{"n":"Zhihao Wu","af":"","cs":"PhD*","h":1,"c":4,"p":8,"d":["DL","MM","ML"],"v":["International Joint Conference on Artificial Intelligence","AAAI Conference on Artificial Intelligence"]},{"n":"Jie Yang","af":"","cs":"PhD*","h":1,"c":16,"p":4,"d":["MM"],"v":["The Web Conference","AAAI Conference on Artificial Intelligence"]},{"n":"Yanhao Chen","af":"","sc":"St. John's University","cs":"PhD*","h":1,"c":8,"p":4,"d":["LLM"],"v":["International Joint Conference on Artificial Intelligence","IEEE International Conference on Computer Vision","AAAI Conference on Artificial Intelligence"]},{"n":"Shilin Zhang","af":"","cs":"PhD*","h":1,"c":7,"p":4,"d":["MM","DL","CV"],"v":["International Joint Conference on Artificial Intelligence","AAAI Conference on Artificial Intelligence"]},{"n":"Zhengzhong Zhu","af":"","sc":"Sichuan University","cs":"PhD*","h":1,"c":1,"p":4,"d":["LLM","MM","DL"],"v":["International Joint Conference on Artificial Intelligence","AAAI Conference on Artificial Intelligence"]},{"n":"Qianqian Wang","af":"","cs":"PhD*","h":1,"c":5,"p":4,"d":["DL","Other"],"v":["International Joint Conference on Artificial Intelligence","AAAI Conference on Artificial Intelligence"]}];

var DIR_FULL={LLM:'Large Language Models',ML:'Machine Learning',DL:'Deep Learning',MM:'Multimodal',CV:'Computer Vision',NLP:'NLP',Infra:'AI Infra',Rec:'Recommendation',Other:'Other'};
var f='all',s='h',q='',pg=1,PS=50;
var isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

function init(){
  renderStats();renderFlt();renderTb();bindEvt();
  // counter anim
  setTimeout(function(){
    document.querySelectorAll('.cu').forEach(function(el){animC(el,parseFloat(el.dataset.t))});
  },500);
  // particles (skip on mobile for performance)
  if(!isMobile)initPts();
}

function animC(el,t){
  var dur=1200,st=performance.now();
  (function up(now){
    var p=Math.min((now-st)/dur,1);
    var e=1-Math.pow(1-p,3);
    var v=Math.round(e*t);
    el.textContent=t>=1000?v.toLocaleString():t%1===0?v:(e*t).toFixed(1);
    if(p<1)requestAnimationFrame(up);
  })(st);
}

function renderStats(){
  var tot=D.length,gh=D.filter(function(d){return d.gh}).length,li=D.filter(function(d){return d.li}).length;
  var avgH=(D.reduce(function(s,d){return s+d.h},0)/tot).toFixed(1);
  var stars=D.reduce(function(s,d){return s+(d.gs||0)},0);
  var sc=D.filter(function(d){return d.sc}).length;
  var items=[{n:tot,l:'Researchers'},{n:14,l:'Conferences'},{n:avgH,l:'Avg H-Index'},{n:sc,l:'Schools'},{n:gh,l:'GitHub'},{n:li,l:'LinkedIn'}];
  document.getElementById('stats').innerHTML=items.map(function(x){return '<div class="sc"><div class="n"><span class="cu" data-t="'+x.n+'">0</span></div><div class="l">'+x.l+'</div></div>'}).join('');
}

function renderFlt(){
  var dc={};D.forEach(function(d){d.d.forEach(function(x){dc[x]=(dc[x]||0)+1})});
  var sorted=Object.entries(dc).sort(function(a,b){return b[1]-a[1]});
  var h='<button class="sb on" data-f="all">All<span class="badge">'+D.length+'</span></button>';
  h+='<button class="sb" data-f="github">GitHub<span class="badge">'+D.filter(function(d){return d.gh}).length+'</span></button>';
  sorted.forEach(function(x){h+='<button class="sb" data-f="'+x[0]+'">'+(DIR_FULL[x[0]]||x[0])+'<span class="badge">'+x[1]+'</span></button>'});
  document.getElementById('flt').innerHTML=h;
}

function getFlt(){
  var list=D;
  if(f==='github')list=list.filter(function(d){return d.gh});
  else if(f!=='all')list=list.filter(function(d){return d.d.indexOf(f)>=0});
  if(q){var ql=q.toLowerCase();list=list.filter(function(d){return d.n.toLowerCase().indexOf(ql)>=0||d.af.toLowerCase().indexOf(ql)>=0||(d.v||[]).some(function(v){return v.toLowerCase().indexOf(ql)>=0})||(d.pos||'').toLowerCase().indexOf(ql)>=0||(d.sc||'').toLowerCase().indexOf(ql)>=0||(d.cs||'').toLowerCase().indexOf(ql)>=0})}
  list.sort(function(a,b){return(b[s]||0)-(a[s]||0)});
  return list;
}

function renderTb(){
  var fl=getFlt(),tp=Math.ceil(fl.length/PS);
  if(pg>tp)pg=1;
  var st=(pg-1)*PS,page=fl.slice(st,st+PS);
  var tb=document.getElementById('tb');
  tb.innerHTML=page.map(function(d,i){
    var rk=st+i+1;
    var tags=d.d.map(function(x){return '<span class="tg t-'+x+'">'+x+'</span>'}).join('');
    var gh=d.gh?'<a href="'+d.gh+'" target="_blank" rel="noopener" class="lk">GH</a>'+(d.gs?'<span class="star">\u2605'+d.gs.toLocaleString()+'</span>':''):'-';
    var lks='';
    if(d.li)lks+='<a href="'+d.li+'" target="_blank" rel="noopener" class="lk">in</a>';
    if(d.hp)lks+='<a href="'+d.hp+'" target="_blank" rel="noopener" class="lk">HP</a>';
    return '<tr class="re" style="animation-delay:'+(i*20)+'ms"><td style="color:var(--muted)">'+rk+'</td><td><b>'+d.n+'</b>'+(d.pos?'<br><small style="color:var(--muted)">'+d.pos+'</small>':'')+'</td><td style="color:var(--muted);font-size:.75rem">'+d.af+'</td><td style="color:var(--muted);font-size:.75rem">'+(d.sc||'-')+'</td><td>'+tags+'</td><td><b style="color:#1d4ed8">'+d.h+'</b></td><td>'+(d.c?d.c.toLocaleString():'-')+'</td><td>'+d.p+'</td><td>'+gh+'</td><td>'+(lks||'-')+'</td></tr>';
  }).join('');
  document.getElementById('pg').innerHTML='<button class="pb" onclick="goPg('+(pg-1)+')"'+(pg===1?' disabled':'')+'>\u2039 Prev</button><span class="pi">'+(st+1)+'-'+Math.min(st+PS,fl.length)+' / '+fl.length+'</span><button class="pb" onclick="goPg('+(pg+1)+')"'+(pg>=tp?' disabled':'')+'>Next \u203a</button>';
}

function goPg(p){pg=p;renderTb();window.scrollTo({top:300,behavior:'smooth'})}

function bindEvt(){
  document.getElementById('flt').addEventListener('click',function(e){
    var btn=e.target.closest('.sb');
    if(!btn)return;
    document.querySelectorAll('#flt .sb').forEach(function(b){b.classList.remove('on')});
    btn.classList.add('on');f=btn.dataset.f;pg=1;renderTb();
  });
  document.querySelector('.sbar').addEventListener('click',function(e){
    var btn=e.target.closest('.st');
    if(!btn)return;
    document.querySelectorAll('.st').forEach(function(b){b.classList.remove('on')});
    btn.classList.add('on');s=btn.dataset.s;pg=1;renderTb();
  });
  var tm;document.getElementById('q').addEventListener('input',function(e){
    clearTimeout(tm);tm=setTimeout(function(){q=e.target.value.trim();pg=1;renderTb()},250);
  });
}

function initPts(){
  var c=document.getElementById('pts'),ctx=c.getContext('2d'),ps=[];
  function rs(){c.width=innerWidth;c.height=innerHeight}
  rs();addEventListener('resize',rs);
  for(var i=0;i<40;i++)ps.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.5+.5,a:Math.random()*.2+.08});
  (function loop(){
    ctx.clearRect(0,0,c.width,c.height);
    ps.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>c.width||p.y<0||p.y>c.height){p.x=Math.random()*c.width;p.y=Math.random()*c.height}
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fillStyle='rgba(37,99,235,'+p.a+')';ctx.fill();
    });
    for(var i=0;i<ps.length;i++)for(var j=i+1;j<ps.length;j++){
      var dx=ps[i].x-ps[j].x,dy=ps[i].y-ps[j].y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<100){ctx.beginPath();ctx.moveTo(ps[i].x,ps[i].y);ctx.lineTo(ps[j].x,ps[j].y);ctx.strokeStyle='rgba(37,99,235,'+(0.05*(1-d/100))+')';ctx.lineWidth=.4;ctx.stroke()}
    }
    requestAnimationFrame(loop);
  })();
}


function toggleAna(btn){
  var el=document.getElementById('ana');
  var show=!el.classList.contains('show');
  el.classList.toggle('show');
  btn.classList.toggle('on');
  if(show&&!el.dataset.rendered){
    el.dataset.rendered='1';
    renderCharts();
  }
}

function renderCharts(){
  renderDirChart();
  renderSchoolChart();
  renderRegionChart();
  renderCareerChart();
}

function renderDirChart(){
  var dc={};
  D.forEach(function(d){d.d.forEach(function(x){dc[x]=(dc[x]||0)+1})});
  var sorted=Object.entries(dc).sort(function(a,b){return b[1]-a[1]});
  var max=sorted[0][1];
  var colors=['#7c3aed','#0891b2','#2563eb','#db2777','#059669','#d97706','#dc2626','#92400e','#64748b'];
  var h=sorted.map(function(x,i){
    var pct=Math.round(x[1]/max*100);
    var c=colors[i%colors.length];
    return '<div class="hbar"><span class="hbar-label">'+(DIR_FULL[x[0]]||x[0])+'</span><div class="hbar-track"><div class="hbar-fill" style="width:'+pct+'%;background:'+c+'" data-v="'+x[1]+'"></div></div><span class="hbar-val">'+x[1]+'</span></div>';
  }).join('');
  document.getElementById('ch-dir').innerHTML=h;
}

function renderSchoolChart(){
  var sc={};
  D.forEach(function(d){if(d.sc){sc[d.sc]=(sc[d.sc]||0)+1}});
  var sorted=Object.entries(sc).sort(function(a,b){return b[1]-a[1]}).slice(0,15);
  var max=sorted[0][1];
  var h=sorted.map(function(x,i){
    var pct=Math.round(x[1]/max*100);
    var hue=200+i*10;
    return '<div class="hbar"><span class="hbar-label" title="'+x[0]+'">'+x[0]+'</span><div class="hbar-track"><div class="hbar-fill" style="width:'+pct+'%;background:hsl('+hue+',65%,50%)" data-v="'+x[1]+'"></div></div><span class="hbar-val">'+x[1]+'</span></div>';
  }).join('');
  document.getElementById('ch-school').innerHTML=h;
}

function renderRegionChart(){
  var cn_kw=['Tsinghua','Peking','Zhejiang','Shanghai Jiao','Fudan','USTC','Harbin','Wuhan','Nanjing','Huazhong','Shandong','Central South','Beijing','Northwestern Poly','Sun Yat','Southeast','East China','Sichuan','Tongji','Renmin','Nankai','Chinese Academy','Beihang','Xi\'an Jiao','Jilin','Xiamen','Dalian','UESTC','South China','Westlake','ShanghaiTech','Southern University of Science','National University of Defense','University of Science and Technology of China'];
  var us_kw=['Stanford','MIT','Carnegie','Berkeley','Princeton','Harvard','Cornell','Columbia','UCLA','UIUC','Illinois','Washington','Georgia Tech','NYU','Penn','Yale','Rice','Duke','Northwestern','Brown','Rutgers','Texas','Michigan','Ohio','Arizona','UC ','Maryland','Minnesota','Purdue','Virginia','Wisconsin','Chicago','Johns Hopkins','Southern California'];
  var hk_kw=['Hong Kong','HKUST'];
  var sg_kw=['Singapore','Nanyang'];
  var eu_kw=['Oxford','Cambridge','ETH','EPFL','Max Planck','Imperial','Edinburgh','UCL','Munich','Aachen','London','Delft','Eindhoven','Surrey'];

  function match(s,kws){return kws.some(function(k){return s.indexOf(k)>=0})}
  var cn=0,us=0,hk=0,sg=0,eu=0,ot=0;
  D.forEach(function(d){
    var s=d.sc||'';
    if(!s)return;
    if(match(s,cn_kw))cn++;
    else if(match(s,us_kw))us++;
    else if(match(s,hk_kw))hk++;
    else if(match(s,sg_kw))sg++;
    else if(match(s,eu_kw))eu++;
    else ot++;
  });
  var regions=[{n:'China Mainland',v:cn,c:'#dc2626'},{n:'United States',v:us,c:'#2563eb'},{n:'Hong Kong',v:hk,c:'#7c3aed'},{n:'Singapore',v:sg,c:'#059669'},{n:'Europe',v:eu,c:'#d97706'},{n:'Other',v:ot,c:'#64748b'}];
  var total=regions.reduce(function(s,r){return s+r.v},0);

  // donut chart
  var r=66,circ=2*Math.PI*r;
  var offset=0;
  var circles=regions.map(function(rg){
    var pct=rg.v/total;
    var dash=pct*circ;
    var gap=circ-dash;
    var svg='<circle cx="80" cy="80" r="'+r+'" stroke="'+rg.c+'" stroke-dasharray="'+dash.toFixed(1)+' '+gap.toFixed(1)+'" stroke-dashoffset="-'+offset.toFixed(1)+'" />';
    offset+=dash;
    return svg;
  }).join('');

  var legend=regions.map(function(rg){
    var pct=Math.round(rg.v/total*100);
    return '<div class="legend-item"><span class="legend-dot" style="background:'+rg.c+'"></span>'+rg.n+' <b>'+rg.v+'</b> ('+pct+'%)</div>';
  }).join('');

  document.getElementById('ch-region').innerHTML='<div class="donut-wrap"><svg class="donut-svg" viewBox="0 0 160 160">'+circles+'</svg><div class="donut-legend">'+legend+'</div></div>';
}

function renderCareerChart(){
  var cs={};
  D.forEach(function(d){if(d.cs){cs[d.cs]=(cs[d.cs]||0)+1}});
  var sorted=Object.entries(cs).sort(function(a,b){return b[1]-a[1]});
  var max=sorted[0][1];
  var colors=['#7c3aed','#2563eb','#0891b2','#059669','#d97706','#dc2626','#64748b','#be185d','#92400e'];
  var h=sorted.map(function(x,i){
    var pct=Math.round(x[1]/max*100);
    var c=colors[i%colors.length];
    return '<div class="hbar"><span class="hbar-label">'+x[0]+'</span><div class="hbar-track"><div class="hbar-fill" style="width:'+pct+'%;background:'+c+'" data-v="'+x[1]+'"></div></div><span class="hbar-val">'+x[1]+'</span></div>';
  }).join('');
  document.getElementById('ch-career').innerHTML=h;
}

init();
</script>
